<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar</title>
  <link rel="stylesheet" href="css/all.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #161616;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .sidebar {
      width: 190px;
      background-color: #111111;
      padding: 13px 10px 500px 1px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .sidebar-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 22px 6px;
    }

    .back-btn {
      cursor: pointer;
      width: 22px;
      height: 23px;
      display: flex;
      justify-content: center;
      align-items: center;
	  margin-left: -5px;
    }
    .back-btn .back-icon {
      width: 17px;
      height: 17px;
      display: block;
      margin-left: 0;
    }
    .back-btn .back-icon polyline,
    .back-btn .back-icon line {
      stroke: #696a60;
      stroke-width: 2.5;
      transition: stroke 0.15s ease;
    }
    .back-btn:hover .back-icon polyline,
    .back-btn:hover .back-icon line {
      stroke: #8a8b7e;
	  stroke-linecap: round;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
      padding-left: 50px;
    }

    .user-name {
      color: #a7a5a3;
      font-size: 11px;
      font-weight: 500;
	  margin-left: 8px;;
    }

    .user-icon-svg {
      width: 16px;
      height: 16px;
      opacity: 0.7;
      display: block;
      flex-shrink: 0;
      margin-left: 0;
    }

    .uk-flag {
      display: block;
      flex-shrink: 0;
      opacity: 0.65;
      margin-left: 0;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-bottom: 16px;
    }

    .section-title {
      color: #696a61;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: -0.06em;
      padding: 0px 12px 8px 12px;
      text-transform: uppercase;
      margin-top: -22px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      color: #D2C5B8;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .menu-item:hover {
      background-color: #111111;
      color: #d4cfc7;
    }

    /* ✅ CHỈ CHỈNH CHỮ "Create Ticket" — KÉO LÊN CHO CÂN VỚI ICON */
    .menu-item .ticket-label {
      position: relative;
      top: -4px;
    }

    .menu-item i {
      width: 18px;
      height: 18px;
      font-size: 14px;
      text-align: center;
      line-height: 18px;
      color: #bebbb6;
      flex-shrink: 0;
      transition: color 0.15s ease;
      margin-left: 0;
    }
    .menu-item:hover i { color: #ffffff; }

    /* ICON HOME */
    .menu-item .home-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      stroke: #bebbb6;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s ease;
      margin-left: -3px;
    }
    .menu-item:hover .home-icon { stroke: #ffffff; }

    /* ICON PURCHASE */
    .menu-item .purchase-icon {
      width: 16px;
      height: 13px;
      flex-shrink: 0;
      fill: #bebbb6;
      transition: fill 0.15s ease;
      margin-left: -2px;
    }
    .menu-item:hover .purchase-icon { fill: #ffffff; }

    /* ICON DISCORD */
    .menu-item .discord-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      fill: #c12fc8;
      transition: fill 0.15s ease;
      margin-left: -1px;
    }
    .menu-item.discord:hover .discord-icon { fill: #c12fc8; }

    /* ICON BOOK (View Tickets) */
    .menu-item .book-icon {
      width: 18px;
      height: 17px;
      flex-shrink: 0;
      display: block;
      transition: stroke 0.15s ease;
      margin-left: 0;
    }
    .menu-item:hover .book-icon path,
    .menu-item:hover .book-icon line { stroke: #ffffff; }

    /* ICON TICKET (Create Ticket) */
    .menu-item .ticket-icon {
      width: 23px;
      height: 30px;
      flex-shrink: 0;
      fill: none;
      stroke: #bebbb6;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: -3px;
      transition: stroke 0.15s ease;
    }
    .menu-item:hover .ticket-icon { stroke: #ffffff; }

    /* ICON CLOUD (Web Config) */
    .menu-item .cloud-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      display: block;
      margin-left: 0;
    }
    .menu-item .cloud-icon path {
      stroke: #bebbb6;
      stroke-width: 2.1;
      transition: stroke 0.15s ease;
    }
    .menu-item:hover .cloud-icon path { stroke: #ffffff; }

    /* ICON GRID (Config Browser) */
    .menu-item .grid-icon {
      width: 15.8px;
      height: 15.8px;
      flex-shrink: 0;
      display: block;
      margin-left: 0;
    }
    .menu-item .grid-icon rect,
    .menu-item .grid-icon line {
      stroke: #bebbb6;
      stroke-width: 2.2;
      transition: stroke 0.15s ease;
    }
    .menu-item:hover .grid-icon rect,
    .menu-item:hover .grid-icon line { stroke: #ffffff; }

    /* ICON CLOUD-DL (Download Lite) */
    .menu-item .cloud-dl-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      display: block;
      margin-left: 0;
    }
    .menu-item .cloud-dl-icon path,
    .menu-item .cloud-dl-icon line,
    .menu-item .cloud-dl-icon polyline {
      stroke: #bebbb6;
      stroke-width: 2.1;
      transition: stroke 0.15s ease;
    }
    .menu-item:hover .cloud-dl-icon path,
    .menu-item:hover .cloud-dl-icon line,
    .menu-item:hover .cloud-dl-icon polyline { stroke: #ffffff; }

    .menu-item.discord { color: #c12fc8; }
    .menu-item.discord:hover { color: #c12fc8; background-color: #111111; }
  </style>
</head>
